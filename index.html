<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylist hẹn lịch khách</title>
<style>
:root{--bg:#fafafa;--ink:#1a1a1a;--muted:#6b7280;--red:#c8372d;--line:#1a1a1a;--chip:#1a1a1a;--chipInk:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121418;--ink:#eceef1;--muted:#9aa1ad;--red:#f07a6f;--line:#eceef1;--chip:#eceef1;--chipInk:#121418}}
:root[data-theme="dark"]{--bg:#121418;--ink:#eceef1;--muted:#9aa1ad;--red:#f07a6f;--line:#eceef1;--chip:#eceef1;--chipInk:#121418}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:40px 16px;text-align:center}
.box{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;min-width:0}
.arrow{width:144px;height:144px;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .15s,background .15s}
.arrow:hover{transform:scale(1.05);background:rgba(127,127,127,.08)}
.arrow svg{width:52px;height:52px}
h1{font-size:clamp(24px,4vw,40px);line-height:1.3;margin:52px 0 18px;font-weight:750;letter-spacing:-.01em}
.red{color:var(--red);font-weight:650;font-size:clamp(15px,2vw,20px);margin:0 0 40px;max-width:720px}
.times{border:1px solid var(--line);border-radius:14px;padding:20px 30px 22px}
.times .k{color:var(--muted);font-weight:600;font-size:16px;margin-bottom:12px}
.chips{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--chipInk);font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px 18px;border-radius:9px}
.url{margin-top:44px;font:17px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);word-break:break-all}
.url a{color:inherit;text-decoration:none}
@media (max-width:600px){
  .arrow{width:104px;height:104px} .arrow svg{width:40px;height:40px}
  h1{margin-top:36px} .times{padding:16px 14px;width:100%} .chips{gap:8px} .chip{font-size:16px;padding:10px 12px}
  .url{font-size:13px}
}
</style>
</head>
<body>
<div class="box">
  <a class="arrow" href="https://reports.30shine.com/0035-bc-hen-lich-stylist/" aria-label="Mở báo cáo Stylist hẹn lịch bản mới">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
  </a>
  <h1>Bấm vào hình mũi tên để xem bản mới nhất của báo cáo Stylist hẹn lịch</h1>
  <p class="red">Mật khẩu xem báo cáo giống mật khẩu xem các báo cáo BI khác (đã cấp cho từng người)</p>
  <div class="times">
    <div class="k">Báo cáo mới cập nhật trong ngày lúc:</div>
    <div class="chips"><span class="chip">7h25</span><span class="chip">10h25</span><span class="chip">14h25</span></div>
  </div>
  <div class="url"><a href="https://reports.30shine.com/0035-bc-hen-lich-stylist/">https://reports.30shine.com/0035-bc-hen-lich-stylist/</a></div>
</div>
</body>
</html>
